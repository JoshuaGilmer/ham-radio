<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ham Radio — broadcast expiring surplus sideways</title>
    <meta
      name="description"
      content="A demo claim board where food pantries broadcast expiring surplus sideways across a partner network. Claude Impact Lab, Birmingham AI. All organizations and numbers on screen are synthetic — nothing here is live availability."
    />

    <!-- Link previews: the demo URL gets pasted into chat and judging sheets, so it
         should not render as a bare link. The synthetic-data disclosure rides along. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ham Radio" />
    <meta property="og:title" content="Ham Radio — broadcast expiring surplus sideways" />
    <meta
      property="og:description"
      content="Pantry-to-pantry signals for food that expires before the next distribution. Demo only — every organization and number on screen is synthetic."
    />
    <meta property="og:url" content="https://joshuagilmer.github.io/ham-radio/" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/JoshuaGilmer/ham-radio/main/docs/board.png"
    />
    <meta property="og:image:alt" content="The Ham Radio board mid-demo: a dairy signal matched to 5 of 11 orgs." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Inline SVG favicon: the wordmark's orange flare dot. Keeps the build self-contained. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23E85D0F'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#F4F6F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101B22" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Theme sync: honors an explicit data-theme stamp (artifact viewer) or the OS preference.
      (function () {
        var root = document.documentElement;
        function apply() {
          var stamped = root.getAttribute("data-theme");
          var dark =
            stamped === "dark" ||
            (stamped !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
        }
        apply();
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
        new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
