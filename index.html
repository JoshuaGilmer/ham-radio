<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ham Radio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Theme sync: honors an explicit data-theme stamp (artifact viewer) or the OS preference.
      (function () {
        var root = document.documentElement;
        function apply() {
          var stamped = root.getAttribute("data-theme");
          var dark =
            stamped === "dark" ||
            (stamped !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
        }
        apply();
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
        new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
